name: Masal bot

# Bot kesintisiz çalışır: her oturum ~50 dk sürer, ~20 sn'de bir tur atar ve bitince
# bir sonraki oturumu kendisi başlatır. Zamanlayıcı ve ayar kaydı sadece yedek tetikleyicidir
# (zincir bir sebeple koparsa yeniden başlatır).
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths: ["docs/ayarlar.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: masal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Son kayıtları al
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git checkout FETCH_HEAD -- docs/data
            git reset -q docs/data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerekli paket
        run: pip install --quiet cryptography
      - name: Bot (kesintisiz)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -m bot.loop
      - name: Sonraki oturumu başlat
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 60; fi
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'
