name: Masal bot

on:
  schedule:
    - cron: "*/5 * * * *"    # 5 dakikada bir uyanır; asıl sıklık uygulamadaki ayardan gelir
    - cron: "40 2 * * 1"     # pazartesi 05:40 (TR) geçmiş test yenilenir
  push:
    paths: ["docs/ayarlar.json"]   # uygulamada ayarlar kaydedilince hemen çalışır
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # her zaman en son ayar ve kayıtla çalış (art arda kayıtlarda eski kopya kullanılmasın)
      - name: Son kayıtları al
        run: |
          # Bot kayıtları "data" dalında tutulur; site her turda yeniden yayınlanmaz
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git checkout FETCH_HEAD -- docs/data
            git reset -q docs/data
          fi
      - name: Sıra kontrolü
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 -m bot.gate
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Gerekli paket
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet cryptography
      - name: Bot turu
        if: steps.gate.outputs.run == 'true'
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python -m bot.run
      - name: Geçmiş test (haftalık)
        if: steps.gate.outputs.run == 'true' && github.event.schedule == '40 2 * * 1'
        run: python -m bot.backtest 30
      - name: Sonuçları kaydet
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/dp && mkdir -p /tmp/dp/docs && cp -r docs/data /tmp/dp/docs/
          cd /tmp/dp
          git init -q -b data
          git add -A
          git -c user.name="masal-bot" -c user.email="masal-bot@users.noreply.github.com" commit -qm "Bot turu $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
