name: Python deneme
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python --version && pip install --quiet cryptography
      - run: |
          python -m compileall -q bot
          python -c "import bot.run, bot.loop, bot.live, bot.vault, bot.backtest; from bot import vault; b=vault.seal({'a':1},'x'); print(vault.unseal(b,'x'))"
          python -c "from bot import okx; print(len(okx.universe()), 'coin')"
