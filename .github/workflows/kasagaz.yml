name: KASA için gaz (ETH) gönder
# Elle çalıştırılır; tek seferlik.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gaz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install --quiet cryptography
      - name: Gönder
        env:
          OKXG_API_KEY: ${{ secrets.OKXG_API_KEY }}
          OKXG_API_SECRET: ${{ secrets.OKXG_API_SECRET }}
          OKXG_API_PASSPHRASE: ${{ secrets.OKXG_API_PASSPHRASE }}
        run: python3 tools/kasa_gaz.py
